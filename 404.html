<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — Mayas</title>
<link rel="icon" type="image/png" href="/assets/app_icon.png">
<link rel="apple-touch-icon" href="/assets/app_icon.png">
<meta name="theme-color" content="#5b3fa0">
  <script>
(() => {
  const REDIRECT_ENABLED = true;

  const OLD_HOST = "dan1eidt.github.io";
  const OLD_PATH = "/mayas-site";
  const NEW_ORIGIN = "https://mayasapp.ru";

  if (!REDIRECT_ENABLED) return;

  if (window.location.hostname !== OLD_HOST) return;

  const currentPath = window.location.pathname;

  if (
    currentPath !== OLD_PATH &&
    !currentPath.startsWith(OLD_PATH + "/")
  ) {
    return;
  }

  const newPath = currentPath.slice(OLD_PATH.length) || "/";
  const destination =
    NEW_ORIGIN +
    newPath +
    window.location.search +
    window.location.hash;

  window.location.replace(destination);
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;700;800&family=Golos+Text:wght@400;500;600&family=Noto+Sans+JP:wght@500;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="/assets/sub.css">
</head>
<body>

<div class="err-code" aria-hidden="true">404</div>
<div class="err-panel">

<p>Ссылка устарела или адрес введён неправильно. Проверьте её ещё раз или вернитесь на главную.</p>
<div class="err-actions"><a class="btn" href="/">На главную</a><a class="btn btn-ghost" href="https://github.com/dan1eIDT/Mayas/releases" target="_blank" rel="noopener">Скачать Mayas</a></div>
<p class="err-links"><a href="https://github.com/dan1eIDT/Mayas" target="_blank" rel="noopener">GitHub</a><a href="/tos.html">Соглашение и конфиденциальность</a></p>
</div></div>
</body>
</html>
