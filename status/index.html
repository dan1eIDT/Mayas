<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Статус сервисов — Mayas</title>
<meta name="description" content="Текущее состояние сайта, веб-версии и серверов Mayas.">
<meta name="theme-color" content="#5b3fa0">
<link rel="canonical" href="https://mayasapp.ru/status/">
<link rel="icon" type="image/png" href="../assets/app_icon.png">
<link rel="apple-touch-icon" href="../assets/app_icon.png">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;700;800&family=Golos+Text:wght@400;500;600&family=Noto+Sans+JP:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/sub.css">
<script>try{if(localStorage.getItem("mayas-theme")==="light")document.documentElement.setAttribute("data-theme","light")}catch(e){}</script>
</head>
<body>
<header class="topbar">
<a class="brand" href="../"><img src="../assets/app_icon.png" alt=""><span>Mayas</span></a>
<div class="top-actions"><a class="back" href="../" data-i18n="back">На сайт</a>
<select class="lang" id="langSelect" aria-label="Language"><option value="ru">RU</option><option value="en">EN</option><option value="es">ES</option><option value="de">DE</option><option value="ja">JA</option></select></div>
</header>
<main>
<div class="hero"><h1 data-i18n="title">Статус сервисов</h1><p data-i18n="desc">Проверки выполняются прямо в вашем браузере и обновляются раз в минуту.</p></div>
<div class="overall is-pending" id="overall" aria-live="polite"><span class="dot"></span><span id="overallText" data-i18n="chk">Проверяем…</span></div>
<div class="checks" id="checks"></div>
<div class="recheck"><button class="btn" id="recheck" type="button" data-i18n="again">Проверить снова</button><span class="updated" id="updated"></span></div>
</main>
<script>
/* Copyright (C) 2026 dan1eIDT */
(function () {
  const WEB = 'https://mayas-47778.web.app/';
  const CFG = WEB + '__/firebase/init.json';
  const GH = 'https://api.github.com/repos/dan1eIDT/Mayas/releases?per_page=1';
  const PROJECT = 'mayas-47778';
  const TIMEOUT = 8000;
  const SLOW = 3000;
  const T = {
    ru: { title: 'Статус сервисов', desc: 'Проверки выполняются прямо в вашем браузере и обновляются раз в минуту.', back: 'На сайт', chk: 'Проверяем…', ok_all: 'Всё работает', warn_all: 'Работает с замедлениями', bad_all: 'Есть сбои', again: 'Проверить снова', upd: 'Обновлено', site: 'Сайт', site_d: 'mayasapp.ru', web: 'Веб-версия', web_d: 'Открывается ли mayas-47778.web.app', cfg: 'Конфигурация Firebase', cfg_d: 'Отдаёт ли хостинг настройки подключения', db: 'База данных', db_d: 'Отвечает ли Firestore на запросы', gh: 'Релизы и APK', gh_d: 'GitHub Releases', ok: 'Работает', slow: 'Медленно', down: 'Недоступно', unk: 'Нет данных', pending: 'Проверка', rel: 'Последний релиз', ms: 'мс' },
    en: { title: 'Service status', desc: 'Checks run right in your browser and refresh every minute.', back: 'Back to site', chk: 'Checking…', ok_all: 'All systems operational', warn_all: 'Running slower than usual', bad_all: 'Some services are down', again: 'Check again', upd: 'Updated', site: 'Website', site_d: 'mayasapp.ru', web: 'Web app', web_d: 'Is mayas-47778.web.app reachable', cfg: 'Firebase configuration', cfg_d: 'Does hosting serve the connection settings', db: 'Database', db_d: 'Does Firestore answer queries', gh: 'Releases and APK', gh_d: 'GitHub Releases', ok: 'Operational', slow: 'Slow', down: 'Down', unk: 'No data', pending: 'Checking', rel: 'Latest release', ms: 'ms' },
    es: { title: 'Estado de los servicios', desc: 'Las comprobaciones se hacen en tu navegador y se actualizan cada minuto.', back: 'Volver al sitio', chk: 'Comprobando…', ok_all: 'Todo funciona', warn_all: 'Funciona con lentitud', bad_all: 'Hay servicios caídos', again: 'Comprobar de nuevo', upd: 'Actualizado', site: 'Sitio web', site_d: 'mayasapp.ru', web: 'Versión web', web_d: 'Si mayas-47778.web.app está accesible', cfg: 'Configuración de Firebase', cfg_d: 'Si el hosting entrega los ajustes de conexión', db: 'Base de datos', db_d: 'Si Firestore responde a las consultas', gh: 'Versiones y APK', gh_d: 'GitHub Releases', ok: 'Funciona', slow: 'Lento', down: 'No disponible', unk: 'Sin datos', pending: 'Comprobando', rel: 'Última versión', ms: 'ms' },
    de: { title: 'Dienststatus', desc: 'Die Prüfungen laufen direkt in deinem Browser und werden jede Minute erneuert.', back: 'Zur Website', chk: 'Prüfe…', ok_all: 'Alles funktioniert', warn_all: 'Läuft langsamer als sonst', bad_all: 'Es gibt Störungen', again: 'Erneut prüfen', upd: 'Aktualisiert', site: 'Website', site_d: 'mayasapp.ru', web: 'Web-Version', web_d: 'Ist mayas-47778.web.app erreichbar', cfg: 'Firebase-Konfiguration', cfg_d: 'Liefert das Hosting die Verbindungseinstellungen', db: 'Datenbank', db_d: 'Antwortet Firestore auf Anfragen', gh: 'Releases und APK', gh_d: 'GitHub Releases', ok: 'Läuft', slow: 'Langsam', down: 'Nicht erreichbar', unk: 'Keine Daten', pending: 'Prüfung', rel: 'Neuestes Release', ms: 'ms' },
    ja: { title: 'サービスの状態', desc: 'チェックはブラウザ上で実行され、1分ごとに更新されます。', back: 'サイトへ戻る', chk: '確認中…', ok_all: 'すべて正常に動作しています', warn_all: '動作が遅くなっています', bad_all: '障害が発生しています', again: 'もう一度確認', upd: '更新', site: 'ウェブサイト', site_d: 'mayasapp.ru', web: 'Web版', web_d: 'mayas-47778.web.app に接続できるか', cfg: 'Firebase 設定', cfg_d: 'ホスティングが接続設定を返すか', db: 'データベース', db_d: 'Firestore がクエリに応答するか', gh: 'リリースと APK', gh_d: 'GitHub Releases', ok: '正常', slow: '低速', down: '停止中', unk: 'データなし', pending: '確認中', rel: '最新リリース', ms: 'ms' }
  };
  const params = new URLSearchParams(location.search);
  const want = (params.get('lang') || navigator.language || 'ru').slice(0, 2).toLowerCase();
  let lang = T[want] ? want : 'ru';
  let keyPromise = null;
  let updated = null;
  let running = false;
  const results = {};
  const order = ['site', 'web', 'cfg', 'db', 'gh'];

  function esc(v) {
    const d = document.createElement('div');
    d.textContent = v == null ? '' : String(v);
    return d.innerHTML;
  }

  function request(url, opt) {
    const c = new AbortController();
    const t = setTimeout(() => c.abort(), TIMEOUT);
    return fetch(url, Object.assign({ cache: 'no-store', signal: c.signal }, opt)).finally(() => clearTimeout(t));
  }

  function getKey() {
    if (!keyPromise) {
      keyPromise = request(CFG)
        .then((r) => { if (!r.ok) throw new Error('cfg'); return r.json(); })
        .then((c) => { if (!c || !c.apiKey) throw new Error('key'); return c.apiKey; });
    }
    return keyPromise;
  }

  const checks = {
    site: () => Promise.resolve({ ms: null }),
    web: () => request(WEB, { mode: 'no-cors' }).then(() => ({})),
    cfg: () => getKey().then(() => ({})),
    db: () => getKey().then((key) => {
      const body = { structuredQuery: { from: [{ collectionId: 'chats' }], where: { compositeFilter: { op: 'AND', filters: [
        { fieldFilter: { field: { fieldPath: 'type' }, op: 'EQUAL', value: { stringValue: 'CHANNEL' } } },
        { fieldFilter: { field: { fieldPath: 'isPublic' }, op: 'EQUAL', value: { booleanValue: true } } },
        { fieldFilter: { field: { fieldPath: 'username' }, op: 'EQUAL', value: { stringValue: 'status-check' } } }
      ] } }, limit: 1 } };
      const s = performance.now();
      return request('https://firestore.googleapis.com/v1/projects/' + PROJECT + '/databases/(default)/documents:runQuery?key=' + encodeURIComponent(key), { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) })
        .then((res) => { if (!res.ok) throw new Error('db'); return res.json(); })
        .then(() => ({ ms: Math.round(performance.now() - s) }));
    }),
    gh: () => request(GH, { headers: { Accept: 'application/vnd.github+json' } })
      .then((res) => {
        if (res.status === 403 || res.status === 429) { const e = new Error('limit'); e.soft = true; throw e; }
        if (!res.ok) throw new Error('gh');
        return res.json();
      })
      .then((d) => ({ note: d && d[0] ? d[0].tag_name : '' }))
  };

  function measure(fn) {
    const s = performance.now();
    return fn().then((extra) => {
      const r = Object.assign({ ms: Math.round(performance.now() - s) }, extra);
      r.state = r.ms != null && r.ms >= SLOW ? 'slow' : 'ok';
      return r;
    }, (err) => ({ ms: null, state: err && err.soft ? 'unk' : 'down' }));
  }

  function render() {
    const t = T[lang];
    document.documentElement.lang = lang;
    document.title = t.title + ' — Mayas';
    document.querySelectorAll('[data-i18n]').forEach((el) => { if (t[el.dataset.i18n]) el.textContent = t[el.dataset.i18n]; });
    document.getElementById('checks').innerHTML = order.map((k) => {
      const r = results[k] || { state: 'pending' };
      let desc = esc(t[k + '_d']);
      if (k === 'gh' && r.note) desc += ' · ' + esc(t.rel) + ' ' + esc(r.note);
      const ms = r.ms != null && k !== 'site' ? esc(r.ms) + ' ' + esc(t.ms) : '';
      return '<div class="svc"><div><h3>' + esc(t[k]) + '</h3><p>' + desc + '</p></div><span class="state is-' + r.state + '">' + esc(t[r.state]) + '</span><span class="ms">' + ms + '</span></div>';
    }).join('');
    const states = order.map((k) => (results[k] || { state: 'pending' }).state);
    let cls = 'is-ok';
    let txt = t.ok_all;
    if (states.includes('pending')) { cls = 'is-pending'; txt = t.chk; }
    else if (states.includes('down')) { cls = 'is-down'; txt = t.bad_all; }
    else if (states.includes('slow') || states.includes('unk')) { cls = 'is-slow'; txt = t.warn_all; }
    document.getElementById('overall').className = 'overall ' + cls;
    document.getElementById('overallText').textContent = txt;
    document.getElementById('updated').textContent = updated ? t.upd + ': ' + updated.toLocaleTimeString(lang) : '';
    document.getElementById('recheck').disabled = running;
  }

  function runAll() {
    if (running) return Promise.resolve();
    running = true;
    keyPromise = null;
    order.forEach((k) => { results[k] = { state: 'pending' }; });
    render();
    return Promise.all(order.map((k) => measure(checks[k]).then((r) => { results[k] = r; render(); })))
      .then(() => { updated = new Date(); running = false; render(); });
  }

  const sel = document.getElementById('langSelect');
  sel.value = lang;
  sel.addEventListener('change', (e) => { lang = e.target.value; render(); });
  document.getElementById('recheck').addEventListener('click', runAll);
  setInterval(() => { if (!document.hidden) runAll(); }, 60000);
  runAll();
})();
</script>
</body>
</html>
